[versions]
agp = "9.4.1"
kotlin = "2.3.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
materialIconsExtended = "1.7.8"
lifecycle = "2.11.0"
navigation = "2.10.2"
coroutines = "1.11.0"
serializationJson = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
coil = "3.6.3"
